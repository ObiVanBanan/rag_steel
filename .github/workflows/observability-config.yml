name: observability-config

on:
  push:
    branches:
      - codex/grafana-search-tracing
  pull_request:
    paths:
      - "compose.yaml"
      - "observability/**"
      - "tests/test_observability_config.py"
      - "tests/test_deployment_config.py"
      - ".github/workflows/observability-config.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install config test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run observability config tests
        run: python -m pytest -q tests/test_observability_config.py tests/test_deployment_config.py

      - name: Validate Docker Compose
        env:
          GRAFANA_ADMIN_PASSWORD: ci-test-password
        run: docker compose config --quiet
