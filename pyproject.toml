[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-steel"
version = "0.1.0"
description = "Hybrid search service for LD analog products"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx[socks]>=0.27,<0.29",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "qdrant-client==1.18.0",
    "uvicorn[standard]>=0.30,<0.39",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0,<4",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
