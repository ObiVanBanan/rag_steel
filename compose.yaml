services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: rag-steel-qdrant
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: localhost,127.0.0.1,qdrant,.local,172.16.0.0/12,10.0.0.0/8
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - rag_network

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-indexer
    init: true
    stop_grace_period: 30s
    profiles:
      - tools
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./mapping_results.csv:/data/mapping_results.csv:ro
      - ./butterfly_mapping_results.csv:/data/butterfly_mapping_results.csv:ro
      - ./competitor_ld_mapping.csv:/data/competitor_ld_mapping.csv:ro
    depends_on:
      - qdrant
    command:
      [
        "/app/.venv/bin/python",
        "indexer.py",
        "--csv",
        "/data/mapping_results.csv",
        "--csv",
        "/data/butterfly_mapping_results.csv",
        "--csv",
        "/data/competitor_ld_mapping.csv"
      ]
    networks:
      - rag_network

volumes:
  qdrant_storage:

networks:
  rag_network:
    driver: bridge
