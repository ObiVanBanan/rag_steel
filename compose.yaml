services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: rag-steel-qdrant
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: localhost,127.0.0.1,qdrant,.local,172.16.0.0/12,10.0.0.0/8
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - rag_network

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-indexer
    init: true
    stop_grace_period: 30s
    profiles:
      - tools
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./mapping_results.csv:/data/mapping_results.csv:ro
      - ./butterfly_mapping_results.csv:/data/butterfly_mapping_results.csv:ro
      - ./competitor_ld_mapping.csv:/data/competitor_ld_mapping.csv:ro
    depends_on:
      - qdrant
    command:
      [
        "/app/.venv/bin/python",
        "indexer.py",
        "--csv",
        "/data/mapping_results.csv",
        "--csv",
        "/data/butterfly_mapping_results.csv",
        "--csv",
        "/data/competitor_ld_mapping.csv"
      ]
    networks:
      - rag_network

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: rag-steel-prometheus
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9095:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - rag_network

  loki:
    image: grafana/loki:3.7.0
    container_name: rag-steel-loki
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    networks:
      - rag_network

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: rag-steel-alloy
    restart: unless-stopped
    init: true
    user: "0:0"
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - rag_network

  grafana:
    image: grafana/grafana:12.4.8
    container_name: rag-steel-grafana
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - rag_network

volumes:
  qdrant_storage:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  rag_network:
    driver: bridge
