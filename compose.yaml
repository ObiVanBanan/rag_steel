services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: rag-steel-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/live', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - rag_network

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-steel-indexer
    profiles:
      - tools
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./mapping_results.csv:/data/mapping_results.csv:ro
    depends_on:
      - qdrant
    command:
      [
        "uv",
        "run",
        "python",
        "indexer.py",
        "--csv",
        "/data/mapping_results.csv",
        "--recreate"
      ]
    networks:
      - rag_network

volumes:
  qdrant_storage:

networks:
  rag_network:
    driver: bridge
